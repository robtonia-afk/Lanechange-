name: Deploy to GitHub Pages

# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
#
# This workflow cannot do that step itself. actions/configure-pages can create
# the Pages site via the API, but the Actions token is refused with "Resource
# not accessible by integration" -- creating a site needs admin rights the
# workflow token does not carry. Once the source is set, every push deploys.

on:
  push:
    branches: [claude/hov-lane-exit-alerts-eds0za]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        # Ship only what the app needs — no tests, tools, or git history.
        run: |
          mkdir -p _site
          cp index.html app.js nav.js styles.css sw.js manifest.webmanifest _site/
          cp -r icons _site/
          ls -R _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
