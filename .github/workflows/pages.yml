name: Deploy to GitHub Pages

# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
#
# This workflow cannot do that step itself. actions/configure-pages can create
# the Pages site via the API, but the Actions token is refused with "Resource
# not accessible by integration" -- creating a site needs admin rights the
# workflow token does not carry. Once the source is set, every push deploys.

on:
  push:
    branches: [claude/hov-lane-exit-alerts-eds0za]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        # Copy by exclusion, not by naming each file. The allowlist this
        # replaces silently omitted a new module, which 404s at import time and
        # leaves every control on the page dead.
        # `*` skips dotfiles, so .git and .github stay out without naming them.
        run: |
          mkdir -p _site
          for item in *; do
            case "$item" in
              _site|tests|tools|dist|node_modules|package.json|package-lock.json|README.md)
                continue ;;
            esac
            cp -r "$item" _site/
          done
          # Stamp the build so a stale copy is identifiable at a glance.
          sed -i "s/__BUILD__/${GITHUB_SHA:0:7}/" _site/index.html
          ls -R _site

      - name: Check the site is complete
        run: node tools/check_site.mjs _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
